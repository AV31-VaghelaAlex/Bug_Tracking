<!DOCTYPE html>
<html>
<head>
    <title>Bug Tracker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            color:white;
            min-height:100vh;
        }
        .card{
            background:#24324a;
            border:none;
            border-radius:15px;
            color:white;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <h1>🐞 Bug Tracker Dashboard</h1>

    <div class="mb-3">
        <a href="/create/" class="btn btn-success">Create Bug</a>
        <a href="/my-bugs/" class="btn btn-warning">My Bugs</a>
    </div>

    <form method="get" class="row mb-3">
        <div class="col-md-5">
            <input class="form-control" name="search" placeholder="Search Bugs">
        </div>

        <div class="col-md-4">
            <select class="form-select" name="status">
                <option value="">All Status</option>
                <option>Open</option>
                <option>In Progress</option>
                <option>Testing</option>
                <option>Closed</option>
            </select>
        </div>

        <div class="col-md-3">
            <button class="btn btn-primary w-100">
                Filter
            </button>
        </div>
    </form>

    <div class="row">

        {% for bug in bugs %}

        <div class="col-md-6">

            <div class="card p-3 mb-3">

                <h4>
                    <a class="text-white"
                       href="/bug/{{ bug.id }}/">
                       {{ bug.title }}
                    </a>
                </h4>

                <p>Status: {{ bug.status }}</p>

                <p>Priority: {{ bug.priority }}</p>

                <p>
                    Assigned:
                    {% if bug.assigned_to %}
                        {{ bug.assigned_to.username }}
                    {% else %}
                        Unassigned
                    {% endif %}
                </p>

            </div>

        </div>

        {% empty %}

        <p>No Bugs Found.</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
